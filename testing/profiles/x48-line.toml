# testing/profiles/x48-line.toml - Plan 17 Task 7 (run x484): the straight-line health drain of revision R1 (spec
# section 9) live at Realistic pace with Multiply, the guide's default line, graded against the HEAD replay of the run's
# own inputs. PZTestKit + the STAGED upload copy (release/NutritionRevamp/Contents/mods/NutritionRevamp, re-staged from
# mod/'s last commit with `python tools/release_pack.py stage mod/NutritionRevamp --out release`; release/ is
# gitignored; mod/ is never booted, CLAUDE.md s5). Nutrition false (ruling T18-1), DayLength 4 (the 90-minute day,
# x481's), sleep off. [sandbox.NR] DeathPace 3 (Realistic) and HealthCombine 2 (Multiply), the declared defaults,
# written so the profile says what the run is. Fixture default, admin (-debug), build 42.21.0. The driver is
# testing/experiments/x484_line.py on x48b_lib.py.
fixture = "default"
description = "PZTestKit + the staged NutritionRevamp upload copy, fixture default, admin (debug), Nutrition off, DayLength 4, sleep off, NR.DeathPace 3 and NR.HealthCombine 2, build 42.21.0 - Plan 17 Task 7: x484."
clients = ["admin"]
run = { hold = 20 }
verify = [
  { side = "server", cmd = "lua.global", args = "NutritionRevamp.version", expect = '"value": "1.0.0"' },
  { side = "client", cmd = "lua.global", args = "NutritionRevamp.version", expect = '"value": "1.0.0"' },
]

[[mods]]
id = "PZTestKit"

[[mods]]
id = "NutritionRevamp"
path = "release/NutritionRevamp/Contents/mods/NutritionRevamp"

[server]
SleepAllowed = false
SleepNeeded = false
timeout = 240                 # the server boot wait (x471's boot about 30 s, x481's about 80 s with admin): bounds the slow-boot fallback under the 600 s cap

[client]
timeout = 180

[sandbox]
Nutrition = false            # the design precondition (ruling T18-1): vanilla nutrition update off
DayLength = 4                 # a 90-minute day; a game hour 225 s at speed 1

[sandbox.NR]
DeathPace = 3                 # Realistic, the declared default
HealthCombine = 2             # Multiply, the declared default
