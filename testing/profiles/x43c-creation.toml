# testing/profiles/x43c-creation.toml - Plan 13 Task 22b (run x436): the creation handler after Tasks 10b and 10c (spec
# section 3.2; rulings 13-16 under Task 17's fix 3): seven respawns of bob with picks armed through creation.picks,
# each graded against the staged kernel's K.body.create and K.body.new, the level, rungs and bands on both sides, the
# re-pin after the first minute, the start energy state and the server log's strips; the display names off bob's
# client; case (e)'s first close.
# PZTestKit at HEAD + the STAGED release copy (release/plan13-x43c; see x43c-surplus.toml). Fixture two: admin
# (-debug), then bob (release, user role), each ready before the next. Nutrition false (ruling T18-1), DayLength 1.
# Build 42.21.0.
# The driver is testing/experiments/x436_creation.py on testing/experiments/x43c_strength_lib.py.
fixture = "two"
description = "PZTestKit + the staged NutritionRevamp release copy (release/plan13-x43c), fixture two, admin (debug) and bob (release), Nutrition off, DayLength 1, build 42.21.0 - x436, Plan 13 Task 22b: creation after Tasks 10b and 10c."
clients = ["admin", "bob"]
run = { hold = 20 }
verify = [
  { side = "server", cmd = "lua.global", args = "NutritionRevamp.version", expect = '"value": "1.0.0"' },
  { side = "client", cmd = "lua.global", args = "NutritionRevamp.version", expect = '"value": "1.0.0"' },
  { side = "client:bob", cmd = "lua.global", args = "NutritionRevamp.version", expect = '"value": "1.0.0"' },
]

[[mods]]
id = "PZTestKit"

[[mods]]
id = "NutritionRevamp"
path = "release/plan13-x43c/NutritionRevamp/Contents/mods/NutritionRevamp"

[server]
SleepAllowed = false
SleepNeeded = false

[client]
timeout = 180

[sandbox]
Nutrition = false            # the design precondition (ruling T18-1): vanilla nutrition update off
DayLength = 1                 # a game day is 15 real minutes; a game minute 0.625 s at true multiplier 1
