# testing/profiles/x39-shootout-h.toml - Plan 11b Task 2 (run x391h), the confirmatory session (ruling T2-1) that replaces x391g (testing/runs/x391g-20261013-115700): the slot-save price (store.probe bench) and own-action latency on admin under idle, burst and mod load at the normal clock (plus the non-Food smoke), N = 60. No seed and no seeded arm (x391f measured it).
# PZTestKit at HEAD, 07c27dc4 or later (016dce05: a ghost run restores its carrier's macros; time.snapshot reports the
# true multiplier; 07c27dc4: the store probe formats tiny magnitudes with tostring, Kahlua %g hangs below 1e-292; plus
# store.probe, action.latency, tick.ring, perf.local, ghost.load/modq/stats/stop, the gclog key) + the STAGED copy of
# the tree at 513778e8 (release/plan11-x39/NutritionRevamp/Contents/mods/NutritionRevamp, staged with
# `python tools/release_pack.py stage mod/NutritionRevamp --out release/plan11-x39`, MANIFEST sha256 83c79a04...52c0;
# release/ is gitignored; mod/ is never booted). No TKX_StudyFoods: no seed food.
# Build 42.21.0 (4a0e9546ec). Fixture `two`: admin (-debug), then bob (release). Nutrition false (ruling T18-1).
# DayLength is NOT set: the fixture's own (4, a game minute 3.75 s of wall) is the normal clock, and the driver sends no time.multiplier.
# The driver is testing/experiments/x391h_bench.py.
# The verify rows are load gates only: the version on the server and both clients, and the harness's ring cap.
fixture = "two"
description = "PZTestKit (016dce05, 07c27dc4) + the staged NutritionRevamp copy (release/plan11-x39, 513778e8), fixture two, admin and bob, Nutrition off, the fixture's DayLength, gclog on - x391h, Plan 11b Task 2 confirmatory session."
clients = ["admin", "bob"]
run = { hold = 20 }
verify = [
  { side = "server", cmd = "lua.global", args = "NutritionRevamp.version", expect = '"value": "1.0.0"' },
  { side = "server", cmd = "lua.global", args = "TK.H0.RING_MAX", expect = '"value": 20000' },
  { side = "client", cmd = "lua.global", args = "NutritionRevamp.version", expect = '"value": "1.0.0"' },
  { side = "client:bob", cmd = "lua.global", args = "NutritionRevamp.version", expect = '"value": "1.0.0"' },
]

[[mods]]
id = "PZTestKit"

[[mods]]
id = "NutritionRevamp"
path = "release/plan11-x39/NutritionRevamp/Contents/mods/NutritionRevamp"

[server]
gclog = true

[client]
timeout = 180

[sandbox]
Nutrition = false            # the design precondition (ruling T18-1): vanilla nutrition update off
