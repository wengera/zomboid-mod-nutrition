# testing/profiles/agent-nozombies.toml - Plan 21: PZAgent beside the harness on the agent fixture (sandbox Zombies = 6, none).
fixture = "agent"
description = "PZTestKit + PZAgent, zombies None (Zombies = 6), 90-minute day, sleep allowed."
run = { hold = 5 }
clients = ["admin"]
verify = [
  { side = "server", cmd = "ping", expect = "pong" },
  { side = "client", cmd = "ping", expect = "pong" },
]

[[mods]]
id = "PZTestKit"

[[mods]]
id = "PZAgent"
path = "testing/PZAgent/PZAgent"

[server]
SleepAllowed = true
SleepNeeded = true

[client]
timeout = 120

[sandbox]
Zombies = 6
