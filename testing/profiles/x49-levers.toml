# testing/profiles/x49-levers.toml - Plan 18 Task 1 (runs x491, x493): the live probe of the symptom levers on the
# 90-minute day (DayLength 4, the default day the design's magnitudes are set for). PZTestKit + TKX_Symptoms by its
# path (testing/experiments/TKX_Symptoms: the server holds of added pain, the ENDURANCE cap and the mood floors, and
# the per-tick snapshots on both sides) on fixture `default`, the one admin client (-debug), build 42.21.0.
# No NutritionRevamp: the profile loads no mod/ file, so vanilla's own levers are measured with no mod writer beside
# them. Nutrition = false (ruling T18-1). SleepAllowed and SleepNeeded true (the brief: sleep on, so FATIGUE accrues
# as on a sleep-on server). The drivers are testing/experiments/x491_levers.py and x493_floors.py on x49_lib.py.
# The verify rows are load gates only: the probe's version on the server and the client.
fixture = "default"
description = "PZTestKit + TKX_Symptoms on fixture default, admin (debug), Nutrition off, DayLength 4, sleep on, build 42.21.0 - Plan 18 Task 1: x491 (pain), x493 (endurance and floors)."
clients = ["admin"]
run = { hold = 20 }
verify = [
  { side = "server", cmd = "lua.global", args = "TKX_Symptoms.version", expect = '"resolved": true' },
  { side = "client", cmd = "lua.global", args = "TKX_Symptoms.version", expect = '"resolved": true' },
]

[[mods]]
id = "PZTestKit"

[[mods]]
id = "TKX_Symptoms"
path = "testing/experiments/TKX_Symptoms"

[server]
SleepAllowed = true
SleepNeeded = true
timeout = 240                 # the server boot wait: bounds a slow boot under the 600 s cap

[client]
timeout = 180

[sandbox]
Nutrition = false            # the design precondition (ruling T18-1): vanilla nutrition update off
DayLength = 4                 # the 90-minute day: a game minute is 3.75 s at speed 1
