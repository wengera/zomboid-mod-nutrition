# testing/profiles/x42-calib.toml - Plan 13 Task 1 (run x423): the XP of one vanilla push-up set to exhaustion (the
# mod's xpPerSet) and check 7's remaining Strength sources (loaded movement, melee). PZTestKit + TKX_TraitLevers by its
# path (its server AddXP recorder) on fixture `default`, the one admin client (-debug).
# No NutritionRevamp: the profile loads no mod/ file. Nutrition = false (ruling T18-1) and DayLength 1.
# The driver is testing/experiments/x423_calib.py on testing/experiments/x42c_calib_lib.py.
# The verify rows are load gates only: the probe's version on the server and the client.
fixture = "default"
description = "PZTestKit + TKX_TraitLevers on fixture default, admin (debug), Nutrition off, DayLength 1, build 42.21.0 - the Plan 13 Task 1 XP-per-set calibration and check 7's loaded-movement and melee sources."
clients = ["admin"]
run = { hold = 20 }
verify = [
  { side = "server", cmd = "lua.global", args = "TKX_TraitLevers.version", expect = '"resolved": true' },
  { side = "client", cmd = "lua.global", args = "TKX_TraitLevers.version", expect = '"resolved": true' },
]

[[mods]]
id = "PZTestKit"

[[mods]]
id = "TKX_TraitLevers"
path = "testing/experiments/TKX_TraitLevers"

[client]
timeout = 180

[sandbox]
Nutrition = false            # the design precondition (ruling T18-1): vanilla nutrition update off
DayLength = 1                 # a game-hour is 37.5 s; a game minute 0.625 s at speed 1
