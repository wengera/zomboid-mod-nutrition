# testing/profiles/x17-itempass.toml - the Plan 6 item-pass acceptance boot (Task 11 profile, Task 12 run): PZTestKit +
# NutritionRevamp (Mode 1, LegacyMirror, dials at their defaults) + TKX_ItemOverride (the unmapped FibreBar) +
# TKX_DeclaredFood (DeclaredBar, a vector through NR_Nutrients), Nutrition = false, DayLength 1, no sleep arm.
# This is the first boot of the item-pass build and so a load test: a script error parks the -debug client.
# What the boot reads (Task 12 arms): a mapped vanilla food's rebalanced values against the record; the unmapped
# FibreBar left at its script values; DeclaredBar's NR_Nutrients vector parsed into the item's vector; the
# eat of each moving the mod's nutrient state; the items.count and item.script bus reads on the server.
# Run x172-20261006-110409 (Plan 6 Task 12, one boot, 610.8 s): the build loaded clean on both sides, eleven re-based foods read the
# block's float32 on the server, the client copy and a client-local spawn, and the table, inferred and declared vectors landed in the eat.
fixture = "default"
description = "PZTestKit + NutritionRevamp (Mode 1, LegacyMirror) + TKX_ItemOverride + TKX_DeclaredFood, Nutrition off, DayLength 1 - the Plan 6 item-pass acceptance."
run = { hold = 20 }
verify = [
  { side = "server", cmd = "items.count", expect = "foodByModule" },
  { side = "server", cmd = "item.script", args = "Base.Apple", expect = "HungerChange" },
  { side = "client", cmd = "lua.global", args = "TK.version", expect = "value" },
  { side = "server", cmd = "lua.global", args = "NutritionRevamp.version", expect = "value" },
]

[[mods]]
id = "PZTestKit"

[[mods]]
id = "NutritionRevamp"
path = "mod/NutritionRevamp"

[[mods]]
id = "TKX_ItemOverride"
path = "testing/experiments/TKX_ItemOverride"

[[mods]]
id = "TKX_DeclaredFood"
path = "testing/experiments/TKX_DeclaredFood"

[server]
SleepAllowed = false
SleepNeeded = false

[client]
timeout = 240

[sandbox]
Nutrition = false            # the design precondition (spec ruling 5): vanilla nutrition update off
DayLength = 1                 # a game-hour is 37.5 s; a game day is 15 real minutes

[sandbox.NR]
Mode = 1
LegacyMirror = true
