# testing/profiles/nr-takeover.toml - the mod in Mode 1, Managed (NR.Mode = 1), DayLength = 1.
# The control row is the harness itself (the walk control); the mod rows pass only if the mod loaded.
fixture = "default"
description = "PZTestKit + NutritionRevamp, Mode 1 (Managed), DayLength 1."
run = { hold = 60 }
verify = [
  { side = "server", cmd = "lua.global", args = "TK.version", expect = "\"resolved\": true" },
  { side = "server", cmd = "lua.global", args = "NutritionRevamp.version", expect = "\"resolved\": true" },
  { side = "client", cmd = "lua.global", args = "TK.version", expect = "\"resolved\": true" },
  { side = "client", cmd = "lua.global", args = "NutritionRevamp.version", expect = "\"resolved\": true" },
]

[[mods]]
id = "PZTestKit"

[[mods]]
id = "NutritionRevamp"
path = "mod/NutritionRevamp"

[client]
timeout = 240

[sandbox]
DayLength = 1                 # a game-hour is 37.5 s (X34's cadence)

[sandbox.NR]
Mode = 1
