# testing/profiles/x48-curve.toml - Plan 17 Task 4 (run x481): the remaining-fraction drain live at Realistic pace with
# Multiply: the opening at the calibrated rate, two states combining (starvation and beriberi), and an admin's switch of
# NR.DeathPace followed within a minute. PZTestKit + the STAGED copy of mod/NutritionRevamp (release/plan17-x48, staged
# before the boot with `python tools/release_pack.py stage mod/NutritionRevamp --out release/plan17-x48`; release/ is
# gitignored; mod/ is never booted, CLAUDE.md s5). Nutrition false (ruling T18-1), DayLength 4 (the 90-minute day, the
# Realistic curves' calibration day), sleep off. [sandbox.NR] DeathPace 3 (Realistic) and HealthCombine 2 (Multiply),
# the declared defaults, written so the profile says what the run is. Fixture default, admin (-debug), build 42.21.0.
# The driver is testing/experiments/x481_curve.py on x48_lib.py.
fixture = "default"
description = "PZTestKit + the staged NutritionRevamp copy (release/plan17-x48), fixture default, admin (debug), Nutrition off, DayLength 4, sleep off, NR.DeathPace 3 and NR.HealthCombine 2, build 42.21.0 - Plan 17 Task 4: x481."
clients = ["admin"]
run = { hold = 20 }
verify = [
  { side = "server", cmd = "lua.global", args = "NutritionRevamp.version", expect = '"value": "1.0.0"' },
  { side = "client", cmd = "lua.global", args = "NutritionRevamp.version", expect = '"value": "1.0.0"' },
]

[[mods]]
id = "PZTestKit"

[[mods]]
id = "NutritionRevamp"
path = "release/plan17-x48/NutritionRevamp/Contents/mods/NutritionRevamp"

[server]
SleepAllowed = false
SleepNeeded = false

[client]
timeout = 180

[sandbox]
Nutrition = false            # the design precondition (ruling T18-1): vanilla nutrition update off
DayLength = 4                 # a 90-minute day; a game hour 225 s at speed 1

[sandbox.NR]
DeathPace = 3                 # Realistic, the declared default
HealthCombine = 2             # Multiply, the declared default
