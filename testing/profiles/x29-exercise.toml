# testing/profiles/x29-exercise.toml - Plan 11f Task 6 (runs x291..x296): research rows 9 (the acute appetite
# suppression around a vigorous bout and its decay) and 10 (the exercise lag over 7 game days)
# (docs/superpowers/research/2026-10-10-live-study-replays/01-harness-facts.md s6). x291 is the vigour gate and the
# decay leg on a fresh fixture; x292..x296 the lag chain on one live body (each session copies the previous one's
# <run>/server and boots it with reuse=True; the first restores the fixture).
# PZTestKit + the STAGED copy of the tree at HEAD (release/x29-exercise/NutritionRevamp/Contents/mods/NutritionRevamp,
# staged fresh before each session with `python tools/release_pack.py stage mod/NutritionRevamp --out release/x29-exercise`;
# release/ is gitignored; mod/ is never booted; each run records the MANIFEST sha) + TKX_StudyFoods by its path.
# Build 42.21.0 (4a0e9546ec); fixture default (admin, -debug). Sleep stays off (the fixture's false/false), so the
# record's sleep state is frozen and the sleep factor inert (#2961); the replay takes sleep_allowed false.
# The drivers are testing/experiments/x291_*.py .. x296_*.py on testing/experiments/x29_exercise_lib.py.
# The verify rows are load gates only: the mod's version on both sides and the study food's script on both sides.
fixture = "default"
description = "PZTestKit + the staged NutritionRevamp copy (release/x29-exercise) + TKX_StudyFoods, fixture default, admin, Nutrition off, DayLength 1, build 42.21.0 - the Plan 11f Task 6 exercise rows 9 and 10: the vigour gate and decay leg, then the lag chain."
clients = ["admin"]
run = { hold = 20 }
verify = [
  { side = "server", cmd = "lua.global", args = "NutritionRevamp.version", expect = '"value": "1.0.0"' },
  { side = "client", cmd = "lua.global", args = "NutritionRevamp.version", expect = '"value": "1.0.0"' },
  { side = "server", cmd = "item.script", args = "TKX.Mixed650", expect = '"via"' },
  { side = "client", cmd = "item.script", args = "TKX.Mixed650", expect = '"via"' },
]

[[mods]]
id = "PZTestKit"

[[mods]]
id = "NutritionRevamp"
path = "release/x29-exercise/NutritionRevamp/Contents/mods/NutritionRevamp"

[[mods]]
id = "TKX_StudyFoods"
path = "testing/experiments/TKX_StudyFoods"

[client]
timeout = 180

[sandbox]
Nutrition = false            # the design precondition (ruling T18-1): vanilla nutrition update off
DayLength = 1                 # a game day is 15 real minutes; a game minute 0.625 s at speed 1 (6.27 ticks, x222)
