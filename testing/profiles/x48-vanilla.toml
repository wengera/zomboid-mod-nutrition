# testing/profiles/x48-vanilla.toml - Plan 17 Task 4 (run x482): the remaining-fraction drain live at Vanilla pace with
# Add, the plain-vanilla corner (spec 2.3): a starving character dies on vanilla's clock, against the replay and x442.
# PZTestKit + the STAGED copy of mod/NutritionRevamp (release/plan17-x48, staged before the boot with
# `python tools/release_pack.py stage mod/NutritionRevamp --out release/plan17-x48`; release/ is gitignored; mod/ is
# never booted, CLAUDE.md s5). Nutrition false (ruling T18-1), DayLength 4 (the 90-minute day, x442's), sleep off.
# [sandbox.NR] DeathPace 1 (Vanilla) and HealthCombine 3 (Add), merged into the server's options file at seed. Fixture
# default, admin (-debug), build 42.21.0. The driver is testing/experiments/x482_vanilla.py on x48_lib.py.
fixture = "default"
description = "PZTestKit + the staged NutritionRevamp copy (release/plan17-x48), fixture default, admin (debug), Nutrition off, DayLength 4, sleep off, NR.DeathPace 1 and NR.HealthCombine 3, build 42.21.0 - Plan 17 Task 4: x482."
clients = ["admin"]
run = { hold = 20 }
verify = [
  { side = "server", cmd = "lua.global", args = "NutritionRevamp.version", expect = '"value": "1.0.0"' },
  { side = "client", cmd = "lua.global", args = "NutritionRevamp.version", expect = '"value": "1.0.0"' },
]

[[mods]]
id = "PZTestKit"

[[mods]]
id = "NutritionRevamp"
path = "release/plan17-x48/NutritionRevamp/Contents/mods/NutritionRevamp"

[server]
SleepAllowed = false
SleepNeeded = false

[client]
timeout = 180

[sandbox]
Nutrition = false            # the design precondition (ruling T18-1): vanilla nutrition update off
DayLength = 4                 # a 90-minute day; a game hour 225 s at speed 1, 7.5 s at speed 30

[sandbox.NR]
DeathPace = 1                 # Vanilla
HealthCombine = 3             # Add
