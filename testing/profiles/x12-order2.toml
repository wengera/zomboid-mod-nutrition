# testing/profiles/x12-order2.toml — slice 12 session 5: the three-way ordering discriminator.
#
# Sessions 1 and 4 both read a number that TWO rules predict. `x121-20260911-030023` read
# `Base.Watermelon` = 111 (`TKX_ItemOverride`), which was FIRST of the three in `Mods=` and also
# the alphabetically-LAST of the two ids that carried a Watermelon body. `x124-20260911-035819`
# read 999 (`TKX_ZWatermelon`), which was FIRST of the three in `Mods=` and LAST of the three
# alphabetically. So "alphabetical-last wins" and "first-in-`Mods=` wins" (i.e. the bodies are
# replayed in REVERSE `Mods=` order) fit both sessions equally, and neither session can separate
# them. Only "`Mods=`-last wins" is out, falsified twice.
#
# This profile separates all three with the SAME three mods and no new one: `TKX_ItemOverride`
# goes FIRST of the three in `Mods=` while `TKX_ZWatermelon` — still the alphabetically last id —
# is moved to the MIDDLE. The three rules now name three different numbers:
#
#   999 (`TKX_ZWatermelon`, id last, `Mods=` middle)  ⇒ ALPHABETICAL-LAST wins
#   111 (`TKX_ItemOverride`, id first, `Mods=` first) ⇒ FIRST-IN-`Mods=` wins (reverse-`Mods=`)
#   777 (`TKX_EatHook`, id middle, `Mods=` last)      ⇒ `Mods=`-LAST wins — falsified twice
#                                                       already, so a 777 here REOPENS both
#   1355                                              ⇒ vanilla survived; nothing was measured
fixture = "default"
description = "PZTestKit + TKX_ItemOverride + TKX_ZWatermelon + TKX_EatHook — slice 12 session 5."
run = { hold = 20 }
verify = [   # tier-(a) rows only: one per mod that CAN be gated, each certain to pass IF the mod
             # loaded at all, and none of them a measurement.
  { side = "server", cmd = "item.script", args = "TKX.FibreBar",     expect = '"DaysFresh": 42' },
  { side = "client", cmd = "lua.global",  args = "TKX_EatHook.version", expect = '"value": 1' },
]
# TKX_ZWatermelon is deliberately UNGATED, and not because a gate was forgotten. It ships no Lua
# (so `lua.global` has nothing to read) and no new item (so `item.script` has no type of its own),
# and the one thing it does ship — a second `item Watermelon` body — is the MEASUREMENT. The
# obvious-looking row, `item.script Base.Watermelon` expecting `"side": "server"`, passes with the
# mod absent: vanilla defines Watermelon, so it gates nothing. F is therefore gated at tier (c) —
# the folder copied into `<cachedir>/mods` plus an EMPTY `mods_not_found` on both sides — which the
# driver records in the artifact (`f_tier_c`) rather than leaving to the reader.

[[mods]]
id = "PZTestKit"
[[mods]]
id = "TKX_ItemOverride"          # FIRST of the three in Mods=, FIRST of the three alphabetically
path = "testing/experiments/TKX_ItemOverride"
[[mods]]
id = "TKX_ZWatermelon"           # MIDDLE of the three in Mods=, LAST of the three alphabetically
path = "testing/experiments/TKX_ZWatermelon"
[[mods]]
id = "TKX_EatHook"               # LAST of the three in Mods=, MIDDLE of the three alphabetically
path = "testing/experiments/TKX_EatHook"
