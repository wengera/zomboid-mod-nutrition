# testing/profiles/x23-panic.toml - Plan 10b addendum Task P3b (run x232): the PANIC sawtooth under a once-a-minute
# write at a realistic target (10; 6.5 as C3). A copy of x23-perf.toml (run x231): PZTestKit + the STAGED copy of the
# tree at dc619d0 (release/perf-dc619d0/NutritionRevamp/Contents/mods/NutritionRevamp, unchanged since x231; release/
# is gitignored; mod/ is never booted) whose server/NR_Server_Bench.lua carries the P1+P3 instruments appended (the
# once-a-minute PANIC/TEMPERATURE hold with its tick and write rings is the one this run uses; sha256 c20f645d...0f8d,
# recorded again in the artifact). Fixture `two`, both clients (`admin` -debug, then `bob` release), Nutrition false
# (ruling T18-1), DayLength 1, sleep allowed and needed (copied from x23-perf; this run does not sleep).
# The driver is testing/experiments/x232_panic.py.
# The verify rows are load gates only: the version on the server and both clients, and the hold ring's size (the
# edited staged copy booted).
fixture = "two"
description = "PZTestKit + the staged NutritionRevamp copy at dc619d0 with the P1+P3 instruments, fixture two, admin and bob, Nutrition off, DayLength 1, sleep on - the PANIC sawtooth at target 10 (and 6.5) under a once-a-minute write."
clients = ["admin", "bob"]
run = { hold = 20 }
verify = [
  { side = "server", cmd = "lua.global", args = "NutritionRevamp.version", expect = '"value": "1.0.0"' },
  { side = "server", cmd = "lua.global", args = "NutritionRevamp.server.bench.HOLD_MAX", expect = '"value": 4000' },
  { side = "client", cmd = "lua.global", args = "NutritionRevamp.version", expect = '"value": "1.0.0"' },
  { side = "client:bob", cmd = "lua.global", args = "NutritionRevamp.version", expect = '"value": "1.0.0"' },
]

[[mods]]
id = "PZTestKit"

[[mods]]
id = "NutritionRevamp"
path = "release/perf-dc619d0/NutritionRevamp/Contents/mods/NutritionRevamp"

[server]
SleepAllowed = true
SleepNeeded = true

[client]
timeout = 180

[sandbox]
Nutrition = false            # the design precondition (ruling T18-1): vanilla nutrition update off
DayLength = 1                 # a game day is 15 real minutes; a game minute 0.625 s (6.27 ticks, x222)
