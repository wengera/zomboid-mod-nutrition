# testing/profiles/x16-seats.toml - the Plan 5 seats boot (Task 2): the x16-surfaces stack plus TKX_TraitProbe (the
# modData-armed trait grant and push), sleep ON. For the seat questions: which hook a write survives, and the trait toggles.
fixture = "default"
description = "PZTestKit + NutritionRevamp (Mode 1, LegacyMirror) + TKX_TraitProbe + TKX_StatWatch, SleepAllowed/SleepNeeded true, DayLength 1 - the Plan 5 seats boot."
run = { hold = 20 }
verify = [
  { side = "server", cmd = "lua.global", args = "TK.version", expect = "\"resolved\": true" },
  { side = "client", cmd = "lua.global", args = "TK.version", expect = "\"resolved\": true" },
  { side = "server", cmd = "lua.global", args = "NutritionRevamp.version", expect = "\"resolved\": true" },
  { side = "client", cmd = "lua.global", args = "NutritionRevamp.version", expect = "\"resolved\": true" },
  { side = "server", cmd = "lua.global", args = "TKX_TraitProbe.version", expect = "\"value\": 1" },
  { side = "client", cmd = "lua.global", args = "TKX_TraitProbe.version", expect = "\"value\": 1" },
  { side = "server", cmd = "lua.global", args = "TKX_StatWatch.version", expect = "\"value\": 1" },
  { side = "client", cmd = "lua.global", args = "TKX_StatWatch.version", expect = "\"value\": 1" },
]

[[mods]]
id = "PZTestKit"

[[mods]]
id = "NutritionRevamp"
path = "mod/NutritionRevamp"

[[mods]]
id = "TKX_TraitProbe"
path = "testing/experiments/TKX_TraitProbe"

[[mods]]
id = "TKX_StatWatch"
path = "testing/experiments/TKX_StatWatch"

[server]
SleepAllowed = true
SleepNeeded = true

[client]
timeout = 240

[sandbox]
Nutrition = false            # the design precondition (spec ruling 5; X7/X41 profiles): vanilla's nutrition update off
DayLength = 1                 # a game-hour is 37.5 s

[sandbox.NR]
Mode = 1
LegacyMirror = true
