# testing/profiles/x27-energy.toml - Plan 11f Task 5 (runs x271..x275): the energy scenarios, research rows 6-8
# (docs/superpowers/research/2026-10-10-live-study-replays/01-harness-facts.md s6): the 36 h fast and the request-level
# days, the steady eater, six meals against three, on one live body over a chain of five sessions (each session copies
# the previous one's <run>/server and boots it with reuse=True; the first restores the fixture).
# PZTestKit + the STAGED copy of the tree at HEAD (release/x27-energy/NutritionRevamp/Contents/mods/NutritionRevamp,
# staged fresh before each session with `python tools/release_pack.py stage mod/NutritionRevamp --out release/x27-energy`;
# release/ is gitignored; mod/ is never booted; each run records the MANIFEST sha) + TKX_StudyFoods by its path.
# Build 42.21.0 (4a0e9546ec); fixture default (admin, -debug). Sleep stays off (the fixture's false/false), so the
# record's sleep state is frozen and the sleep factor inert (#2961); the replay takes sleep_allowed false.
# The drivers are testing/experiments/x271_*.py .. x275_*.py on testing/experiments/x27_energy_lib.py.
# The verify rows are load gates only: the mod's version on both sides and the study food's script on both sides.
fixture = "default"
description = "PZTestKit + the staged NutritionRevamp copy (release/x27-energy) + TKX_StudyFoods, fixture default, admin, Nutrition off, DayLength 1, build 42.21.0 - the Plan 11f Task 5 energy scenarios (rows 6-8), a chain of five sessions."
clients = ["admin"]
run = { hold = 20 }
verify = [
  { side = "server", cmd = "lua.global", args = "NutritionRevamp.version", expect = '"value": "1.0.0"' },
  { side = "client", cmd = "lua.global", args = "NutritionRevamp.version", expect = '"value": "1.0.0"' },
  { side = "server", cmd = "item.script", args = "TKX.Mixed650", expect = '"via"' },
  { side = "client", cmd = "item.script", args = "TKX.Mixed650", expect = '"via"' },
]

[[mods]]
id = "PZTestKit"

[[mods]]
id = "NutritionRevamp"
path = "release/x27-energy/NutritionRevamp/Contents/mods/NutritionRevamp"

[[mods]]
id = "TKX_StudyFoods"
path = "testing/experiments/TKX_StudyFoods"

[client]
timeout = 180

[sandbox]
Nutrition = false            # the design precondition (ruling T18-1): vanilla nutrition update off
DayLength = 1                 # a game day is 15 real minutes; a game minute 0.625 s at speed 1 (6.27 ticks, x222)
