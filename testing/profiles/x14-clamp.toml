# testing/profiles/x14-clamp.toml - the Plan 3 clamp acceptance boot (Task 19, X141c): PZTestKit +
# NutritionRevamp (Mode 1) + TKX_XpEvents. DayLength 1 (the shortest the sandbox takes): a game-hour
# is 37.5 s, so the six game hours the Strength rise hysteresis waits are 225 s (3.75 min). Client
# timeout normal. Tier-(a) verify rows only: the markers are present on both sides.
fixture = "default"
description = "PZTestKit + NutritionRevamp (Mode 1) + TKX_XpEvents, DayLength 1 - the clamp acceptance."
run = { hold = 20 }
verify = [
  { side = "server", cmd = "lua.global", args = "TK.version", expect = "\"resolved\": true" },
  { side = "client", cmd = "lua.global", args = "TK.version", expect = "\"resolved\": true" },
  { side = "server", cmd = "lua.global", args = "NutritionRevamp.version", expect = "\"resolved\": true" },
  { side = "client", cmd = "lua.global", args = "NutritionRevamp.version", expect = "\"resolved\": true" },
  { side = "server", cmd = "lua.global", args = "TKX_XpEvents.version", expect = "\"value\": 1" },
  { side = "client", cmd = "lua.global", args = "TKX_XpEvents.version", expect = "\"value\": 1" },
]

[[mods]]
id = "PZTestKit"

[[mods]]
id = "NutritionRevamp"
path = "mod/NutritionRevamp"

[[mods]]
id = "TKX_XpEvents"
path = "testing/experiments/TKX_XpEvents"

[client]
timeout = 240

[sandbox]
DayLength = 1                 # a game-hour is 37.5 s

[sandbox.NR]
Mode = 1
