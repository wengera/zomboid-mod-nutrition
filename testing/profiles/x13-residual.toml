# testing/profiles/x13-residual.toml - the X34 / X35 / X4 residual arms: the mod in takeover
# (Mode 1); TKX_CalcStats counts CalculateStats calls (X32/X46); X35's running arm needs a probe
# handler that WRITES the 0.4242 sentinel, which no shipped probe does (x132r-20261005-072441); the driver boots nr-overlay for its control.
fixture = "default"
description = "PZTestKit + NutritionRevamp (Mode 1) + TKX_CalcStats, DayLength 1 - X34, X35, X4 residual arms."
run = { hold = 60 }
verify = [
  { side = "server", cmd = "lua.global", args = "TK.version", expect = "\"resolved\": true" },
  { side = "client", cmd = "lua.global", args = "TK.version", expect = "\"resolved\": true" },
  { side = "server", cmd = "lua.global", args = "NutritionRevamp.version", expect = "\"resolved\": true" },
  { side = "client", cmd = "lua.global", args = "NutritionRevamp.version", expect = "\"resolved\": true" },
  { side = "server", cmd = "lua.global", args = "TKX_CalcStats.version", expect = "\"value\": 1" },
  { side = "client", cmd = "lua.global", args = "TKX_CalcStats.version", expect = "\"value\": 1" },
]

[[mods]]
id = "PZTestKit"

[[mods]]
id = "NutritionRevamp"
path = "mod/NutritionRevamp"

[[mods]]
id = "TKX_CalcStats"
path = "testing/experiments/TKX_CalcStats"

[client]
timeout = 240

[sandbox]
DayLength = 1                 # a game-hour is 37.5 s

[sandbox.NR]
Mode = 1
