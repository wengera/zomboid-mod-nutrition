# testing/profiles/nr-accept.toml - the nutrition mod on the golden fixture, no sandbox override.
# The control row is the harness itself (the walk control); the mod rows pass only if the mod loaded.
fixture = "default"
description = "PZTestKit + NutritionRevamp on the fixture's own day length - Plan 1 acceptance."
run = { hold = 60 }
verify = [
  { side = "server", cmd = "lua.global", args = "TK.version", expect = "\"resolved\": true" },
  { side = "server", cmd = "lua.global", args = "NutritionRevamp.version", expect = "\"value\": \"0.1.0\"" },
  { side = "client", cmd = "lua.global", args = "TK.version", expect = "\"resolved\": true" },
  { side = "client", cmd = "lua.global", args = "NutritionRevamp.version", expect = "\"value\": \"0.1.0\"" },
]

[[mods]]
id = "PZTestKit"

[[mods]]
id = "NutritionRevamp"
path = "mod/NutritionRevamp"
