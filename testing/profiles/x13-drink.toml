# testing/profiles/x13-drink.toml - X13: ISDrinkFluidAction updateEat / complete per side.
# TKX_DrinkHook wraps both methods on both sides; the rows gate only that each mod loaded.
fixture = "default"
description = "PZTestKit + NutritionRevamp + TKX_DrinkHook - X13 (the drink action's side)."
run = { hold = 20 }
verify = [
  { side = "server", cmd = "lua.global", args = "TK.version", expect = "\"resolved\": true" },
  { side = "client", cmd = "lua.global", args = "TK.version", expect = "\"resolved\": true" },
  { side = "server", cmd = "lua.global", args = "NutritionRevamp.version", expect = "\"resolved\": true" },
  { side = "client", cmd = "lua.global", args = "NutritionRevamp.version", expect = "\"resolved\": true" },
  { side = "server", cmd = "lua.global", args = "TKX_DrinkHook.version", expect = "\"value\": 1" },
  { side = "client", cmd = "lua.global", args = "TKX_DrinkHook.version", expect = "\"value\": 1" },
]

[[mods]]
id = "PZTestKit"

[[mods]]
id = "NutritionRevamp"
path = "mod/NutritionRevamp"

[[mods]]
id = "TKX_DrinkHook"
path = "testing/experiments/TKX_DrinkHook"

[client]
timeout = 240
