# testing/profiles/x34-monotony.toml - Plan 11f Task 9r (runs x341, x342, x343): research row 13 (monotony) re-run on
# the self-limiting floor design (Task 9b and its fixes 1 and 2), Mono450 three times a day for five game days, then a
# varied diet, with a reconnect mid-release, on one live body over a chain of three sessions (each later session copies
# the previous one's <run>/server and boots it with reuse=True; the first restores the fixture).
# PZTestKit + the STAGED copy of the tree at HEAD (release/x34-monotony/NutritionRevamp/Contents/mods/NutritionRevamp,
# staged fresh before each session with `python tools/release_pack.py stage mod/NutritionRevamp --out release/x34-monotony`;
# release/ is gitignored; mod/ is never booted; each run records the MANIFEST sha) + TKX_StudyFoods by its path.
# Build 42.21.0 (4a0e9546ec); fixture default (admin, -debug). Sleep stays off (the fixture's false/false), so no stop
# falls in a sleep (vanilla's boredom updater returns for a sleeping player, #3015); the replay takes sleep_allowed false.
# The drivers are testing/experiments/x341_monotony.py, x342_monotony.py and x343_monotony.py on
# testing/experiments/x34_monotony_lib.py.
# The verify rows are load gates only: the mod's version on both sides and the study foods' scripts on both sides.
fixture = "default"
description = "PZTestKit + the staged NutritionRevamp copy (release/x34-monotony) + TKX_StudyFoods, fixture default, admin, Nutrition off, DayLength 1, sleep off, build 42.21.0 - the Plan 11f Task 9r monotony floor (row 13), a chain of three sessions."
clients = ["admin"]
run = { hold = 20 }
verify = [
  { side = "server", cmd = "lua.global", args = "NutritionRevamp.version", expect = '"value": "1.0.0"' },
  { side = "client", cmd = "lua.global", args = "NutritionRevamp.version", expect = '"value": "1.0.0"' },
  { side = "server", cmd = "item.script", args = "TKX.Mixed650", expect = '"via"' },
  { side = "client", cmd = "item.script", args = "TKX.Mixed650", expect = '"via"' },
  { side = "server", cmd = "item.script", args = "TKX.Mono450", expect = '"via"' },
  { side = "server", cmd = "item.script", args = "TKX.Dense400Lo", expect = '"via"' },
]

[[mods]]
id = "PZTestKit"

[[mods]]
id = "NutritionRevamp"
path = "release/x34-monotony/NutritionRevamp/Contents/mods/NutritionRevamp"

[[mods]]
id = "TKX_StudyFoods"
path = "testing/experiments/TKX_StudyFoods"

[client]
timeout = 180

[sandbox]
Nutrition = false            # the design precondition (ruling T18-1): vanilla nutrition update off
DayLength = 1                 # a game day is 15 real minutes; a game minute 0.625 s at speed 1 (6.27 ticks, x222)
