# testing/profiles/x43-beyondten.toml - Plan 13 Task 19 (run x431): the level write with BeyondTen loaded (spec section
# 12.2; rulings 13-10, 13-42, 13-43): a shown level of 12.3 parks native Strength at 10 with BeyondTen's stored mastery
# XP, a grant at the park trains and re-pins, a forced rust pass leaves the parked 10, and a level of 9.5 leaves it.
# PZTestKit at HEAD + the STAGED release copy (release/plan13-x43, `python tools/release_pack.py stage
# mod/NutritionRevamp --out release/plan13-x43`, made before the boot; mod/ is never booted; the driver checks the
# staged MANIFEST against release_pack's manifest of a clean mod/NutritionRevamp before the boot and refuses on a
# mismatch) + BeyondTen by its workshop item 3765241705 (the read-only workshop folder, copied in by the harness).
# Fixture default, the one admin client (-debug). Nutrition false (ruling T18-1), DayLength 1. Build 42.21.0.
# The driver is testing/experiments/x431_beyondten.py on testing/experiments/x43_strength_lib.py.
fixture = "default"
description = "PZTestKit + the staged NutritionRevamp release copy (release/plan13-x43) + BeyondTen (workshop 3765241705), fixture default, admin (debug), Nutrition off, DayLength 1, build 42.21.0 - x431, Plan 13 Task 19: the BeyondTen level write, grant, rust pass and leave."
clients = ["admin"]
run = { hold = 20 }
verify = [
  { side = "server", cmd = "lua.global", args = "NutritionRevamp.version", expect = '"value": "1.0.0"' },
  { side = "client", cmd = "lua.global", args = "NutritionRevamp.version", expect = '"value": "1.0.0"' },
  { side = "server", cmd = "lua.global", args = "BeyondTen.API_VERSION", expect = '"resolved": true' },
]

[[mods]]
id = "PZTestKit"

[[mods]]
id = "NutritionRevamp"
path = "release/plan13-x43/NutritionRevamp/Contents/mods/NutritionRevamp"

[[mods]]
id = "BeyondTen"
workshop_id = "3765241705"

[client]
timeout = 180

[sandbox]
Nutrition = false            # the design precondition (ruling T18-1): vanilla nutrition update off
DayLength = 1                 # a game day is 15 real minutes; a game minute 0.625 s at true multiplier 1
