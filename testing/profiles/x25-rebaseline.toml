# testing/profiles/x25-rebaseline.toml - Plan 11a Task R Step 8 (run x250): the 42.21 smoke. The harness
# self-check, idle frames under tick.ring and perf.local, and x231's phase A (the slow minute by step in play).
# PZTestKit + the STAGED copy of the tree at HEAD 457f39f (release/rebaseline-x250/NutritionRevamp/Contents/mods/
# NutritionRevamp; release/ is gitignored; mod/ is never booted) whose server/NR_Server_Bench.lua is overwritten by
# testing/spikes/instruments/x231_NR_Server_Bench.lua (x231's P1+P3 instruments; sha256 c20f645d...0d8d, the same
# file x231 booted: the server Lua is unchanged since dc619d0 bar the two regenerated NR_Data_*.lua headers).
# Build 42.21.0 (4a0e9546ec); both fixtures provisioned on it. x23-perf.toml byte for byte below this header except
# the description and the path: fixture `two`, both clients (`admin` -debug, then `bob` release), Nutrition false
# (ruling T18-1), DayLength 1, sleep allowed and needed.
# The driver is testing/experiments/x250_rebaseline.py.
# The verify rows are load gates only: the version on the server and both clients, and the hold ring's size (the
# edited staged copy booted).
fixture = "two"
description = "PZTestKit + the staged NutritionRevamp copy at 457f39f with x231's P1+P3 instruments, fixture two, admin and bob, Nutrition off, DayLength 1, sleep on, build 42.21.0 - the harness self-check, idle frames and the slow minute by step."
clients = ["admin", "bob"]
run = { hold = 20 }
verify = [
  { side = "server", cmd = "lua.global", args = "NutritionRevamp.version", expect = '"value": "1.0.0"' },
  { side = "server", cmd = "lua.global", args = "NutritionRevamp.server.bench.HOLD_MAX", expect = '"value": 4000' },
  { side = "client", cmd = "lua.global", args = "NutritionRevamp.version", expect = '"value": "1.0.0"' },
  { side = "client:bob", cmd = "lua.global", args = "NutritionRevamp.version", expect = '"value": "1.0.0"' },
]

[[mods]]
id = "PZTestKit"

[[mods]]
id = "NutritionRevamp"
path = "release/rebaseline-x250/NutritionRevamp/Contents/mods/NutritionRevamp"

[server]
SleepAllowed = true
SleepNeeded = true

[client]
timeout = 180

[sandbox]
Nutrition = false            # the design precondition (ruling T18-1): vanilla nutrition update off
DayLength = 1                 # a game day is 15 real minutes; a game minute 0.625 s (6.27 ticks, x222)
