# testing/profiles/x49-accept.toml - Plan 18 Task 4 (run x494): the live acceptance of the symptom layer on a seeded
# Realistic fast with water (starvation, then wet beriberi at clinical): the Pain, Endurance, Stress and Unhappy moodles
# on the server and on the client, then the release after a snack, graded against the HEAD replay of the run's own
# inputs. PZTestKit + the STAGED upload copy (release/NutritionRevamp/Contents/mods/NutritionRevamp, re-staged from
# mod/'s last commit with `python tools/release_pack.py stage mod/NutritionRevamp --out release`; release/ is gitignored;
# mod/ is never booted, CLAUDE.md s5) + the probe TKX_Symptoms by its path (testing/experiments/TKX_Symptoms; an
# observer only: its per-tick snapshots on both sides and its level trackers, no hold armed). Nutrition false (ruling
# T18-1), DayLength 4 (the 90-minute day the design's magnitudes are set for), sleep off (the endurance cap is the lever
# that works on every server). [sandbox.NR] Mode 1, DeathPace 3 (Realistic), HealthCombine 2 (Multiply) and Severity
# 1.0, the declared defaults, written so the profile says what the run is. Fixture default, admin (-debug), build
# 42.21.0. The driver is testing/experiments/x494_accept.py on x49b_lib.py.
fixture = "default"
description = "PZTestKit + the staged NutritionRevamp upload copy + TKX_Symptoms (observer), fixture default, admin (debug), Nutrition off, DayLength 4, sleep off, NR.Mode 1, DeathPace 3, HealthCombine 2, Severity 1.0, build 42.21.0 - Plan 18 Task 4: x494."
clients = ["admin"]
run = { hold = 20 }
verify = [
  { side = "server", cmd = "lua.global", args = "NutritionRevamp.version", expect = '"value": "1.0.0"' },
  { side = "client", cmd = "lua.global", args = "NutritionRevamp.version", expect = '"value": "1.0.0"' },
  { side = "server", cmd = "lua.global", args = "TKX_Symptoms.version", expect = '"resolved": true' },
  { side = "client", cmd = "lua.global", args = "TKX_Symptoms.version", expect = '"resolved": true' },
]

[[mods]]
id = "PZTestKit"

[[mods]]
id = "NutritionRevamp"
path = "release/NutritionRevamp/Contents/mods/NutritionRevamp"

[[mods]]
id = "TKX_Symptoms"
path = "testing/experiments/TKX_Symptoms"

[server]
SleepAllowed = false
SleepNeeded = false
timeout = 240                 # the server boot wait (x484's): bounds the slow-boot fallback under the 600 s cap

[client]
timeout = 180

[sandbox]
Nutrition = false            # the design precondition (ruling T18-1): vanilla nutrition update off
DayLength = 4                 # a 90-minute day; a game minute 3.75 s at speed 1

[sandbox.NR]
Mode = 1                      # Hybrid: the mod owns HUNGER and THIRST, so starvation's symptoms apply (spec 1.6)
DeathPace = 3                 # Realistic, the declared default
HealthCombine = 2             # Multiply, the declared default
Severity = 1.0                # the dial's default: the symptom magnitudes unscaled (spec 1.5)
